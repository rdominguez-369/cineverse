<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse</title>
    <link rel="stylesheet" href="styles.css">
    <script src="metricas.js" async></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>CineVerse</h1>
        <p>Portal de reserva de entradas</p>
    </header>

    <main>
        <section id="perfil">
            <h2>Perfil del espectador</h2>
        </section>

        <section id="taquilla">
            <h2>Taquilla</h2>
        </section>

        <section id="oferta">
            <h2>Venta Anticipada</h2>
        </section>

        <section id="resumen">
            <h2>Resumen de compra</h2>
        </section>
        
        <section id="criticas">
            <h2>Criticas de peliculas</h2>
        </section>

        <section id="resenas">
            <h2>Reseñas de películas</h2>

            <label for="opinion">Escribe tu opinión:</label>

            <textarea
                id="opinion"
                rows="4"
                placeholder="Escribe aquí tu reseña..."
            ></textarea>

            <button id="btn-enviar-resena" type="button">
                Enviar reseña
            </button>

            <h3>Opiniones de los espectadores</h3>

            <div id="lista-resenas"></div>
        </section>
    </main>

    <footer>
        <p>CineVerse</p>
    </footer>
    
</body>
</html>
